name: Update Decks

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild all configured decks
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - decks/**
      - .github/decks-state.json
  pull_request:
    paths:
      - decks.yml
      - package.json
      - package-lock.json
      - scripts/**
      - .github/skills/onedrive-deck-id/**
      - .github/workflows/update-decks.yml
      - .github/workflows/publish-pages.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('slides-tests-{0}', github.event.pull_request.number) || 'slides-publication' }}
  queue: max
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run verify:converter

  update:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Create publisher token
        id: publisher
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.SLIDE_PUBLISHER_APP_CLIENT_ID }}
          private-key: ${{ secrets.SLIDE_PUBLISHER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-secrets: write
      - name: Synchronize and push generated presentations
        id: sync
        run: node scripts/sync-decks.mjs
        env:
          APP_SLUG: ${{ steps.publisher.outputs.app-slug }}
          ONEDRIVE_CLIENT_ID: ${{ vars.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_AUTH_CACHE: ${{ secrets.ONEDRIVE_AUTH_CACHE }}
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}

  publish:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-pages.yml
    with:
      commit: ${{ needs.update.outputs.sha }}
