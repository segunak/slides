name: Update Decks

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild all configured decks
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - decks.yml
      - package.json
      - package-lock.json
      - scripts/**
      - .github/workflows/update-decks.yml
  pull_request:
    paths:
      - decks.yml
      - package.json
      - package-lock.json
      - scripts/**
      - .github/skills/onedrive-deck-id/**
      - .github/workflows/update-decks.yml

permissions:
  contents: read

concurrency:
  group: update-decks-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm test

  update:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - name: Create publisher token
        id: publisher
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.SLIDE_PUBLISHER_APP_CLIENT_ID }}
          private-key: ${{ secrets.SLIDE_PUBLISHER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-secrets: write
      - name: Update changed presentations
        run: npm run update-decks
        env:
          ONEDRIVE_CLIENT_ID: ${{ vars.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_AUTH_CACHE: ${{ secrets.ONEDRIVE_AUTH_CACHE }}
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
      - name: Commit generated changes
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          APP_SLUG: ${{ steps.publisher.outputs.app-slug }}
        run: |
          git add -- decks .github/decks-state.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq '.id')
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git
          git commit -m "Update published decks"
          git push origin HEAD:main
